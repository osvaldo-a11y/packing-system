  <!-- seal — mid-lower so object-cover keeps it -->
  <g fill="#3A4A2A" opacity="0.7" font-family="Georgia, 'Times New Roman', serif">
    <text x="868" y="302" text-anchor="end" font-size="12" font-weight="700" letter-spacing="0.18em">PINEBLOOM FARMS</text>
    <text x="868" y="318" text-anchor="end" font-size="9.5" font-weight="600" letter-spacing="0.14em" opacity="0.9" font-family="Inter, system-ui, sans-serif">NEWTON, GA | EST. 2012</text>
